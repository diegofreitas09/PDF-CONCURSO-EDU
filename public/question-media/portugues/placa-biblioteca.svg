<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Placa de biblioteca</title><desc id="desc">Cartaz com o texto Biblioteca: fale baixo, leia alto por dentro. Celular no silencioso.</desc><rect width="900" height="520" rx="36" fill="#f7f3ea"/><rect x="70" y="60" width="760" height="400" rx="28" fill="#ffffff" stroke="#b51f2e" stroke-width="10"/><circle cx="180" cy="190" r="70" fill="#172b4d"/><path d="M135 175h90v20h-90zm10-40h70v20h-70zm0 80h70v20h-70z" fill="#fff"/><text x="290" y="150" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#172b4d">BIBLIOTECA</text><text x="290" y="225" font-family="Arial, sans-serif" font-size="36" fill="#333">Fale baixo.</text><text x="290" y="276" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#b51f2e">Leia alto por dentro.</text><line x1="120" y1="330" x2="780" y2="330" stroke="#d8d8d8" stroke-width="4"/><text x="180" y="400" font-family="Arial, sans-serif" font-size="34" fill="#333">📵 Celular no silencioso</text></svg>