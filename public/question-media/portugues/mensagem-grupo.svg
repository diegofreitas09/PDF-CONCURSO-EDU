<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Conversa em grupo de mensagens</title><desc id="desc">Conversa informal com abreviações: Galera, vcs vão pra revisão hj?; Eu vou! Chego umas 18h.; Blz, me avisem qdo começar.</desc><rect width="900" height="560" rx="34" fill="#e9eef4"/><rect x="80" y="55" width="740" height="450" rx="28" fill="#fff"/><rect x="80" y="55" width="740" height="75" rx="28" fill="#172b4d"/><text x="120" y="105" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Grupo: Revisão de Português</text><rect x="120" y="170" width="500" height="70" rx="24" fill="#f0f2f5"/><text x="145" y="214" font-family="Arial, sans-serif" font-size="29" fill="#222">Galera, vcs vão pra revisão hj?</text><rect x="300" y="275" width="460" height="70" rx="24" fill="#d9fdd3"/><text x="330" y="319" font-family="Arial, sans-serif" font-size="29" fill="#222">Eu vou! Chego umas 18h.</text><rect x="120" y="380" width="530" height="70" rx="24" fill="#f0f2f5"/><text x="145" y="424" font-family="Arial, sans-serif" font-size="29" fill="#222">Blz, me avisem qdo começar.</text></svg>