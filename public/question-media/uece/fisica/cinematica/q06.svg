<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Esquema dos dois pares de polias da questão UECE 2019.2</title>
  <desc id="desc">No conjunto C, duas polias de 20 e 50 cm estão em eixos independentes ligadas por correia sem deslizamento. No conjunto E, polias de 20 e 50 cm compartilham o mesmo eixo.</desc>
  <rect width="900" height="460" fill="white"/>
  <g fill="none" stroke="#1f2937" stroke-width="5">
    <circle cx="170" cy="220" r="55"/>
    <circle cx="390" cy="220" r="115"/>
    <line x1="170" y1="165" x2="390" y2="105"/>
    <line x1="170" y1="275" x2="390" y2="335"/>
    <circle cx="675" cy="220" r="55"/>
    <circle cx="675" cy="220" r="115"/>
    <line x1="535" y1="220" x2="815" y2="220"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111827">
    <text x="80" y="55" font-size="26" font-weight="700">Conjunto C — correia sem deslizamento</text>
    <text x="555" y="55" font-size="26" font-weight="700">Conjunto E — mesmo eixo</text>
    <text x="128" y="226" font-size="22">20 cm</text>
    <text x="350" y="226" font-size="22">50 cm</text>
    <text x="632" y="226" font-size="22">20 cm</text>
    <text x="645" y="96" font-size="22">50 cm</text>
    <text x="120" y="390" font-size="20">Cω20</text>
    <text x="350" y="390" font-size="20">Cω50</text>
    <text x="600" y="390" font-size="20">Eω20 e Eω50</text>
  </g>
</svg>
