name: Integrar UECE lote 06
on:
  push:
    paths:
      - scripts/integrar_uece_lote_06.py
      - .github/workflows/integrate-uece-lote-06.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install --disable-pip-version-check gdown pymupdf
      - name: Gerar lote a partir da apostila oficial
        run: python scripts/integrar_uece_lote_06.py
      - name: Auditar lote 100
        run: node scripts/verificar_uece_lote_06.mjs
      - name: Verificador de integração
        run: python scripts/verificar_integracao_questoes.py
      - name: Verificador de mídias
        run: python scripts/verificar_midias_questoes.py
      - run: npm ci
      - name: Build
        run: npm run build
      - run: git diff --check
      - name: Conectar lote ao repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/questionSources/ueceTransicaoLote100_06.js src/data/questionRegistry.js scripts/verificar_uece_lote_06.mjs
          git commit -m "feat: integra UECE lote 464-563" || exit 0
          git push
