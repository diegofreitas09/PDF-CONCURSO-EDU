name: Integrar UECE lote 06
on:
  push:
    paths:
      - scripts/integrar_uece_lote_06.py
      - .github/workflows/integrate-uece-lote-06.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install --disable-pip-version-check gdown pymupdf
      - name: Baixar apostila oficial com fallback robusto
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/uece_11ed.pdf
          python -m gdown 'https://drive.google.com/uc?id=18fCbZ_iEnHHg_mdvKqtEBVBsl-A3pP0k' -O /tmp/uece_11ed.pdf || true
          if [ ! -s /tmp/uece_11ed.pdf ] || [ "$(stat -c%s /tmp/uece_11ed.pdf)" -lt 30000000 ]; then
            rm -f /tmp/uece_11ed.pdf
            curl -fL --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=18fCbZ_iEnHHg_mdvKqtEBVBsl-A3pP0k&export=download&confirm=t' -o /tmp/uece_11ed.pdf
          fi
          test "$(stat -c%s /tmp/uece_11ed.pdf)" -ge 30000000
          python - <<'PY'
          import fitz
          p='/tmp/uece_11ed.pdf'
          d=fitz.open(p)
          assert len(d)==1187, len(d)
          print('PDF_OK', len(d))
          PY
      - name: Gerar lote a partir da apostila oficial
        run: python scripts/integrar_uece_lote_06.py
      - name: Auditar lote 100
        run: node scripts/verificar_uece_lote_06.mjs
      - name: Verificador de integração
        run: python scripts/verificar_integracao_questoes.py
      - name: Verificador de mídias
        run: python scripts/verificar_midias_questoes.py
      - run: npm ci
      - name: Build
        run: npm run build
      - run: git diff --check
      - name: Conectar lote ao repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/questionSources/ueceTransicaoLote100_06.js src/data/questionRegistry.js scripts/verificar_uece_lote_06.mjs
          git commit -m "feat: integra UECE lote 464-563" || exit 0
          git push
