name: Integrar UECE lote 08
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/integrar_uece_lote_08.py"
      - "scripts/uece_lote08_rebuild_*.b64"
      - ".github/workflows/integrate-uece-lote-08.yml"
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Conferir fonte compactada
        run: test $(ls scripts/uece_lote08_rebuild_*.b64 | wc -l) -eq 8
      - name: Diagnosticar fragmentos
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          parts=[]
          for i in range(1,9):
              s=Path(f'scripts/uece_lote08_rebuild_{i}.b64').read_text().strip(); parts.append(s)
              p=s+'='*((4-len(s)%4)%4); b=base64.b64decode(p,validate=True)
              print(i,'chars',len(s),'mod4',len(s)%4,'head',s[:12],'tail',s[-12:],'bytes',len(b),'magic',b[:6].hex())
          enc=''.join(parts); blob=base64.b64decode(enc,validate=True)
          dec=lzma.LZMADecompressor(); out=0
          for pos in range(0,len(blob),64):
              try:
                  out += len(dec.decompress(blob[pos:pos+64]))
              except Exception as e:
                  print('XZ_FAIL_RANGE',pos,pos+64,'OUT',out,'ERR',repr(e),'B64_AROUND',enc[max(0,pos*4//3-32):pos*4//3+96])
                  break
          else:
              print('XZ_STREAM_OK','OUT',out,'EOF',dec.eof)
          PY
      - name: Gerar e conectar lote
        run: python scripts/integrar_uece_lote_08.py
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Auditar lote
        run: node scripts/verificar_uece_lote_08.mjs
      - name: Verificar integração
        run: python scripts/verificar_integracao_questoes.py
      - name: Verificar mídias
        run: python scripts/verificar_midias_questoes.py
      - name: Instalar dependências
        run: npm install
      - name: Build
        run: npm run build
      - name: Validar diff
        run: git diff --check -- ':!package-lock.json'
      - name: Commitar lote integrado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/questionSources/uecePortuguesLote100_08.js src/data/questionRegistry.js scripts/verificar_uece_lote_08.mjs .github/workflows/deploy-pages.yml
          if git diff --cached --quiet; then echo "Nada para commitar"; exit 0; fi
          git commit -m "feat: integra UECE Português lote 08"
          git push
