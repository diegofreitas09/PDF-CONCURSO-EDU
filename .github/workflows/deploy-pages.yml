name: Deploy GitHub Pages
# UECE lote 15 em integração auditada

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar lote UECE Historia 276-375
        if: ${{ hashFiles('src/data/questionSources/ueceHistoriaLote100_14.js') == '' }}
        run: |
          pip install pymupdf
          UECE_PDF_URL="https://drive.usercontent.google.com/download?id=18fCbZ_iEnHHg_mdvKqtEBVBsl-A3pP0k&export=download&confirm=t" python scripts/integrar_uece_lote_14.py

      - name: Persistir lote UECE Historia 276-375
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/questionRegistry.js src/data/questionSources/ueceHistoriaLote100_14*.js scripts/verificar_uece_lote_14.mjs
            git commit -m "feat(uece): integrar lote 14 de Historia"
            git push origin HEAD:main
          fi

      - name: Preparar lote UECE Historia 376-475
        if: ${{ hashFiles('src/data/questionSources/ueceHistoriaLote100_15.js') == '' }}
        run: |
          pip install pymupdf
          UECE_PDF_URL="https://drive.usercontent.google.com/download?id=18fCbZ_iEnHHg_mdvKqtEBVBsl-A3pP0k&export=download&confirm=t" python scripts/integrar_uece_lote_15.py

      - name: Persistir lote UECE Historia 376-475
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/questionRegistry.js src/data/questionSources/ueceHistoriaLote100_15*.js scripts/verificar_uece_lote_15.mjs
            git commit -m "feat(uece): integrar lote 15 de Historia"
            git push origin HEAD:main
          fi

      - name: Verificar integracao das questoes
        run: python scripts/verificar_integracao_questoes.py

      - name: Auditar identidade UECE Matematica
        run: python scripts/auditar_uece_matematica_corrigido.py

      - name: Verificar midias das questoes
        run: python scripts/verificar_midias_questoes.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Auditar lote UECE Fisica
        run: node scripts/verificar_uece_fisica.mjs

      - name: Auditar lote UECE Quimica
        run: node scripts/verificar_uece_quimica.mjs

      - name: Importar Biologia p01
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p01.js')"
      - name: Importar Biologia p02
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p02.js')"
      - name: Importar Biologia p03
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p03.js')"
      - name: Importar Biologia p04
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p04.js')"
      - name: Importar Biologia p05
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p05.js')"
      - name: Importar Biologia p06
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p06.js')"
      - name: Importar Biologia p07
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p07.js')"
      - name: Importar Biologia p08
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p08.js')"
      - name: Importar Biologia p09
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p09.js')"
      - name: Importar Biologia p10
        run: node -e "import('./src/data/questionSources/ueceBiologiaLote100_05_p10.js')"

      - name: Auditar lote UECE Biologia
        run: node scripts/verificar_uece_biologia.mjs
      - name: Auditar lote UECE transicao Biologia-Portugues
        run: node scripts/verificar_uece_lote_06.mjs
      - name: Auditar lote UECE Portugues 70-169
        run: node scripts/verificar_uece_lote_07.mjs
      - name: Auditar lote UECE Portugues 170-269
        run: node scripts/verificar_uece_lote_08.mjs
      - name: Auditar lote UECE Portugues 270-369
        run: node scripts/verificar_uece_lote_09.mjs
      - name: Auditar lote UECE transicao Portugues-Educacao Fisica
        run: node scripts/verificar_uece_lote_10.mjs
      - name: Auditar lote UECE transicao Educacao Fisica-Historia
        run: node scripts/verificar_uece_lote_11.mjs
      - name: Auditar lote UECE Historia 76-175
        run: node scripts/verificar_uece_lote_12.mjs
      - name: Auditar lote UECE Historia 176-275
        run: node scripts/verificar_uece_lote_13.mjs
      - name: Auditar lote UECE Historia 276-375
        run: node scripts/verificar_uece_lote_14.mjs
      - name: Auditar lote UECE Historia 376-475
        run: node scripts/verificar_uece_lote_15.mjs

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4